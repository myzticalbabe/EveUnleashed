[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-npu-lane"
version = "0.1.0"
description = "Quarantined Intel AI Boost (NPU) probe lane for EveUnleashed: enumerate, infer, measure. OpenVINO-only, never inside mcml/."
requires-python = ">=3.10"
dependencies = ["openvino>=2026.0", "numpy>=1.22"]

[project.scripts]
eve-npu-probe = "eve_npu_lane:main"

[tool.setuptools.packages.find]
where = ["src"]
