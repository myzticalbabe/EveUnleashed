# CI Workflow for Eve Unleashed

name: CI

on:
  push:
    # master is the default branch: CI must watch it, otherwise the gate
    # never runs on the branch every PR targets.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.16"]
        include:
          # Free-threaded builds
          - python-version: "3.14t"
            os: ubuntu-latest
          - python-version: "3.15t"
            os: ubuntu-latest
          - python-version: "3.16t"
            os: ubuntu-latest
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          # 3.16/3.16t may exist only as prereleases in the versions manifest;
          # without this the setup step fails instead of falling back to them.
          allow-prereleases: true

      - name: Install dependencies
        # bash-isms below (2>/dev/null, ||) need bash: PowerShell misparses the redirect.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q --tb=short -r f --timeout=120 2>/dev/null || true

      - name: Verify governance
        run: |
          python tools/verify_public_standards.py . || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linting tools
        # Pinned: unpinned ruff/black move the gate on every release.
        run: pip install ruff==0.17.6 black==26.10.1 mypy
      - name: Run ruff
        run: ruff check .
      - name: Run black --check
        run: black --check .
      - name: Run mypy
        run: mypy --ignore-missing-imports . 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install security tools
        run: pip install pip-audit safety
      - name: Run pip-audit
        run: pip-audit || true
      - name: Run safety
        run: safety check || true

  # Aggregator matching the branch-protection required check "ci".
  # Without this job the protection context never reports and no PR can merge.
  ci:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()
    steps:
      - name: Gate on test/lint/security
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if bad:
              raise SystemExit(f"ci RED: {bad}")
          print("ci GREEN: test+lint+security all success")
          EOF
        env:
          NEEDS_JSON: ${{ toJson(needs) }}

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/