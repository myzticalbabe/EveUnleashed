# CI Workflow for Eve Unleashed

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Free-threaded builds (3.16/3.16t dropped: no such release on hosted runners)
          - python-version: "3.14t"
            os: ubuntu-latest
          - python-version: "3.15t"
            os: ubuntu-latest
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # bash-isms below (2>/dev/null, ||) need bash: PowerShell misparses the redirect.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q --tb=short -r f --timeout=120 2>/dev/null || true

      - name: Verify governance
        run: |
          python tools/verify_public_standards.py . || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linting tools
        run: pip install ruff black mypy
      - name: Run ruff
        run: ruff check .
      - name: Run black --check
        run: black --check .
      - name: Run mypy
        run: mypy --ignore-missing-imports . 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install security tools
        run: pip install pip-audit safety
      - name: Run pip-audit
        run: pip-audit || true
      - name: Run safety
        run: safety check || true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/